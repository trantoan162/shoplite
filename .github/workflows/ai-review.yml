name: AI Code Review

on:
  pull_request:
    branches: [main, bmad/module78]
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.KHOAHOCAI2 }}
          path_to_claude_code_executable: /home/runner/.local/bin/claude
          prompt: |
            Review this pull request thoroughly. Check for bugs, edge cases, security issues, and code quality, then provide actionable feedback.
