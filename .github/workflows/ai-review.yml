name: AI Code Review

on:
  pull_request:
    branches: [main, bmad/module78]
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1.0.259
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.KHOAHOCAI2 }}
          path_to_claude_code_executable: /home/runner/.local/bin/claude
          prompt: |
            Thực hiện code review cho Pull Request này bằng tiếng Việt theo đúng quy trình `bmad-code-review` và checklist của nhóm trong repository.

            Các bước thực thi bắt buộc:
            1. Đọc hướng dẫn dự án tại `CLAUDE.md`, `AGENTS.md`, bộ skill/workflow trong `.claude/` và `bmad-lab-kit/` (tìm skill `bmad-code-review` và file checklist nhóm).
            2. Đọc các tài liệu đặc tả liên quan trong `_bmad-output/` (`specs/spec-shoplite-bmad-module4/acceptance-criteria.md`, `planning-artifacts/architecture/.../ARCHITECTURE-SPINE.md`, và các file `implementation-artifacts/spec-1-*.md` tương ứng với PR).
            3. Đọc toàn bộ diff của PR và kiểm tra mã nguồn thực tế theo đủ 5 lớp phát hiện:
               - `blind-hunter`
               - `edge-case-hunter`
               - `verification-gap`
               - `acceptance-auditor`
               - `checklist-auditor`

            Đăng bình luận tổng hợp lên Pull Request với tiêu đề:
            `### Kết quả review (bmad-code-review + checklist nhóm)`

            Trình bày toàn bộ các phát hiện dưới dạng một bảng Markdown gồm đúng 6 cột sau:
            | Mã mục | Lớp phát hiện | Verdict | Bucket | Vị trí | Tóm tắt & Đề xuất |
            | :--- | :--- | :--- | :--- | :--- | :--- |

            Quy tắc điền từng cột:
            - **Mã mục**: đánh mã theo nguồn phát hiện (`BM-1`, `SPEC-1`, `AT-1`...).
            - **Lớp phát hiện**: liệt kê các lớp đã phát hiện ra vấn đề (ví dụ: `blind-hunter, edge-case-hunter, verification-gap, acceptance-auditor, checklist-auditor`).
            - **Verdict**: mức độ nghiêm trọng (`high`, `medium`, `low`).
            - **Bucket**: hành động đề xuất (`patch`, `defer`, `note`).
            - **Vị trí**: đường dẫn file và số dòng cụ thể (ví dụ: `src/features/orders/process-lock.ts:108`).
            - **Tóm tắt & Đề xuất**: giải thích ngắn gọn nguyên nhân, rủi ro và cách sửa cụ thể.
